<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event | SLICNA</title>
  <meta name="description" content="SLICNA event details and registration.">
  <meta name="theme-color" content="#062b2a">
  <link rel="icon" type="image/png" href="/images/slicna-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body data-section="learning">
<div id="site-header"></div>

<main id="main">
  <section class="page-head" style="padding-bottom:24px">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="/index.html">Home</a> / <a href="/pages/events.html">Events</a> / <a id="crumb-kind" href="/pages/events.html">CPD Events</a></nav>
      <div class="event-tags" id="event-tags"></div>
      <h1 id="event-title" class="event-title">Loading…</h1>
      <p class="lede" id="event-summary" hidden></p>
    </div>
  </section>

  <section class="section-tight" style="padding-top:0">
    <div class="wrap event-detail">
      <div class="event-main">
        <div class="event-poster" id="event-photo" hidden></div>
        <div id="event-about" hidden>
          <h2 class="event-about-title">About this event</h2>
          <div class="prose" id="event-body"></div>
        </div>
        <a class="attachment-link" id="event-attachment" hidden target="_blank" rel="noopener">
          <span class="attachment-ico" aria-hidden="true">PDF</span>
          <span><b>Programme / brochure</b><span id="event-attachment-name"></span></span>
        </a>
      </div>
      <aside class="event-aside">
        <div class="event-card">
          <dl class="facts" id="event-facts"></dl>
          <div class="event-fees" id="event-fees" hidden></div>
          <div class="event-register" id="event-register"></div>
        </div>
        <div class="event-card event-bank" id="event-bank" hidden>
          <h3>Paying the fee</h3>
          <p class="muted">Pay by bank transfer or deposit before registering, then upload the slip with your registration.</p>
          <div id="event-bank-box"></div>
        </div>
      </aside>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script src="/js/membership-common.js"></script>
<script src="/js/event-detail.js"></script>
</body>
</html>
