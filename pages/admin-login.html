<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff login | SLICNA</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#062b2a">
  <link rel="icon" type="image/png" href="/images/slicna-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <section class="section">
    <div class="wrap" style="max-width:480px">
      <div class="form-card">
        <img src="/images/slicna-logo.png" alt="" width="64" height="64" style="margin-bottom:12px">
        <h1 style="font-size:32px">Staff login</h1>
        <p class="muted">For SLICNA committee members who manage website content.</p>
        <form id="login-form" class="form-grid" novalidate>
          <div class="field full"><label for="l-username">Username</label><input id="l-username" name="username" required autocomplete="username"></div>
          <div class="field full"><label for="l-password">Password</label><input id="l-password" name="password" type="password" required autocomplete="current-password"></div>
          <div class="full"><button class="btn btn-teal btn-block" type="submit">Log in</button></div>
        </form>
        <div class="form-status" id="login-status" role="status"></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('login-form');
    const status = document.getElementById('login-status');
    const show = (kind, message) => { status.className = 'form-status ' + (kind === 'ok' ? 'is-ok' : 'is-error'); status.textContent = message; };

    if (sessionStorage.getItem('slicna_admin_token')) window.location.replace('/pages/admin.html');
    if (new URLSearchParams(location.search).has('expired')) show('error', 'Your session has expired. Please log in again.');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = form.username.value.trim();
      const password = form.password.value;
      if (!username || !password) return show('error', 'Please enter your username and password.');

      const button = form.querySelector('[type="submit"]');
      button.disabled = true;
      try {
        const data = await SLICNA_API.request('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        sessionStorage.setItem('slicna_admin_token', data.token);
        sessionStorage.setItem('slicna_admin_user', JSON.stringify(data.user));
        window.location.replace('/pages/admin.html');
      } catch (err) {
        show('error', err.message);
        button.disabled = false;
      }
    });
  });
</script>
</body>
</html>
