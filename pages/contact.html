<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | SLICNA</title>
  <meta name="description" content="Contact the Sri Lanka Intensive Care Nurses Association by phone, email or the online form.">
  <meta name="theme-color" content="#062b2a">
  <link rel="icon" type="image/png" href="/images/slicna-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body data-section="contact">
<div id="site-header"></div>

<main id="main">
  <section class="page-head">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="/index.html">Home</a> / Contact</nav>
      <p class="eyebrow">Contact</p>
      <h1>Let's talk</h1>
      <p class="lede">Questions about membership, CPD programmes or working together? We'll get back to you as soon as we can.</p>
    </div>
  </section>

  <section class="section-tight" style="padding-top:0">
    <div class="wrap split">
      <div class="contact-tiles reveal">
        <a class="contact-tile" href="tel:+94713385768">
          <span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>
          <span><b>Phone</b><span>071 338 5768</span></span>
        </a>
        <a class="contact-tile" href="mailto:slicna2022@gmail.com">
          <span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
          <span><b>Email</b><span>slicna2022@gmail.com</span></span>
        </a>
        <div class="contact-tile">
          <span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
          <span><b>Location</b><span>Colombo, Sri Lanka</span></span>
        </div>
        <a class="contact-tile" href="https://www.facebook.com/p/Sri-Lanka-Intensive-Care-Nurses-Association-100091247713065/" target="_blank" rel="noopener">
          <span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8v-6.78H7.9V12.2H10V9.8c0-2.07 1.26-3.22 3.15-3.22.9 0 1.85.16 1.85.16v2.3h-1.04c-1.02 0-1.34.64-1.34 1.3v1.86h2.3l-.37 2.82H12.6V21.8c4.56-.93 8-4.96 8-9.8z"/></svg></span>
          <span><b>Facebook</b><span>Follow for event announcements</span></span>
        </a>
      </div>

      <div class="form-card reveal">
        <h2 style="font-size:28px">Send us a message</h2>
        <form id="contact-form" class="form-grid" novalidate>
          <div class="field"><label for="c-name">Your name</label><input id="c-name" name="name" required autocomplete="name"></div>
          <div class="field"><label for="c-phone">Phone <span class="opt">(optional)</span></label><input id="c-phone" name="phone" type="tel" autocomplete="tel"></div>
          <div class="field full"><label for="c-email">Email</label><input id="c-email" name="email" type="email" required autocomplete="email"></div>
          <div class="field full">
            <label for="c-topic">Topic</label>
            <select id="c-topic" name="subject">
              <option>Membership</option>
              <option>CPD programmes</option>
              <option>Partnership or sponsorship</option>
              <option>Media</option>
              <option>Something else</option>
            </select>
          </div>
          <div class="field full"><label for="c-message">Message</label><textarea id="c-message" name="message" required></textarea></div>
          <div class="full"><button class="btn btn-coral" type="submit">Send message</button></div>
        </form>
        <div class="form-status" id="contact-status" role="status"></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/js/config.js"></script>
<script src="/js/demo-data.js"></script>
<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script src="/js/forms.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    SLICNA_FORMS.bind('contact-form', 'contact-status', (data) => SLICNA_API.sendContact(data),
      'Thank you. Your message has been sent, and we will reply by email.');
  });
</script>
</body>
</html>
