<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events &amp; Workshops | SLICNA</title>
  <meta name="description" content="Upcoming and past SLICNA CPD programmes, international workshops and community events.">
  <meta name="theme-color" content="#062b2a">
  <link rel="icon" type="image/png" href="/images/slicna-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
</head>
<body data-section="events">
<div id="site-header"></div>

<main id="main">
  <section class="page-head">
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="/index.html">Home</a> / Learning / Events</nav>
      <p class="eyebrow">Events &amp; workshops</p>
      <h1>Learn, take part, connect</h1>
      <p class="lede">CPD events for critical care nurses, and our AGMs and community events. Register online for CPD events while registration is open.</p>
    </div>
  </section>

  <section class="section-tight" style="padding-top:0" id="spotlight-wrap" hidden>
    <div class="wrap"><div id="spotlight"></div></div>
  </section>

  <section class="section-tight event-list-section" style="padding-top:0" id="all-events">
    <div class="wrap">
      <div class="events-toolbar">
        <div class="seg" role="group" aria-label="Event kind">
          <label><input type="radio" name="kind" value="cpd" checked> CPD Events</label>
          <label><input type="radio" name="kind" value="other"> Association Events</label>
          <label><input type="radio" name="kind" value="all"> All</label>
        </div>
        <div class="seg" role="group" aria-label="When">
          <label><input type="radio" name="when" value="upcoming" checked> Upcoming</label>
          <label><input type="radio" name="when" value="past"> Past</label>
        </div>
      </div>
      <p class="muted events-count" id="events-count" aria-live="polite"></p>
      <div class="event-list" id="events-list"><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script src="/js/events.js"></script>
</body>
</html>
